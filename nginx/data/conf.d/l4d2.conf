# ============================================================
# l4d2.tunarund.top — 站点入口
# ============================================================

upstream php_backend     { server php:9000; }

# ---- 接口限流（IP 级，防暴力破解/邮箱轰炸）----
# limit_req 的 key 为空时跳过限流，故仅敏感端点映射到真实 IP，其余请求不受限
map $uri $auth_key {
    default           "";
    /api/login.php    $binary_remote_addr;
    /api/register.php $binary_remote_addr;
}
map $uri $email_key {
    default             "";
    /api/check_email.php $binary_remote_addr;
}

limit_req_zone $auth_key zone=auth:10m rate=5r/m;
limit_req_zone $email_key zone=email:10m rate=3r/m;

# ---- HTTPS（推荐） ----
server {
    listen 443 ssl;
    http2 on;
    server_name l4d2.tunarund.top;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;

    include /etc/nginx/conf.d/common.inc;
}

# ---- HTTP：允许浏览公开内容，登录/注册跳转到 HTTPS ----
server {
    listen 80;
    server_name l4d2.tunarund.top;

    location = /api/login.php    { return 301 https://$host$request_uri; }
    location = /api/register.php { return 301 https://$host$request_uri; }

    include /etc/nginx/conf.d/common.inc;
}

# ---- IP 直接访问：允许浏览公开内容，登录/注册跳转到域名 HTTPS ----
server {
    listen 80 default_server;
    server_name _;

    location = /api/login.php    { return 301 https://l4d2.tunarund.top$request_uri; }
    location = /api/register.php { return 301 https://l4d2.tunarund.top$request_uri; }

    include /etc/nginx/conf.d/common.inc;
}
